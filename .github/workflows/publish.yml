# Publishes the package to PyPI when a GitHub release is published.
# Uses PyPI "trusted publishing" (OIDC): register this repository and workflow at
# https://pypi.org/manage/account/publishing/ once; no API token is stored anywhere.
name: publish
on:
  release:
    types: [published]
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
